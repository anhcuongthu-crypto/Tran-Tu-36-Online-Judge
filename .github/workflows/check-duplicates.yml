
name: Check Duplicate Problems

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find duplicate problems
        run: python check_duplicates.py

      - name: Upload duplicate report
        uses: actions/upload-artifact@v4
        with:
          name: duplicates-report
          path: duplicates_report.json
