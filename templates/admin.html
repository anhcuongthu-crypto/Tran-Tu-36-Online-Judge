
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị Online Judge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
            background: #f5f7fb;
            color: #222;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        button {
            padding: 9px 14px;
            margin: 4px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .danger {
            background: #dc2626;
        }

        .secondary {
            background: #64748b;
        }

        .success {
            background: #15803d;
        }

        .panel {
            background: white;
            padding: 20px;
            margin: 18px 0;
            border-radius: 12px;
            box-shadow: 0 2px 10px #0000000d;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 0;
        }

        .problem-info {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
        }

        .problem-info input {
            margin-top: 5px;
            width: 18px;
            height: 18px;
        }

        .problem-info h3 {
            margin-bottom: 6px;
        }

        .muted {
            color: #64748b;
            margin: 0;
        }

        .message {
            margin: 12px 0;
            white-space: pre-wrap;
        }

        .error-message {
            color: #dc2626;
        }

        .success-message {
            color: #15803d;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .user-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 6px;
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
        }

        .user-status.approved {
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 600px) {
            .section-heading {
                align-items: flex-start;
            }

            .section-heading > div:last-child {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>Quản trị Online Judge</h1>

    <!-- QUẢN LÝ TÀI KHOẢN -->
    <section class="panel">
        <div class="section-heading">
            <div>
                <h2>Tài khoản học sinh</h2>
                <p class="muted">
                    Xem tài khoản và phê duyệt tài khoản đang chờ.
                </p>
            </div>

            <button type="button" id="refresh-users" class="secondary">
                Tải lại danh sách
            </button>
        </div>

        <div id="user-message" class="message"></div>
        <div id="users-list">Đang tải tài khoản...</div>
    </section>

    <!-- NGÂN HÀNG BÀI TẬP -->
    <section class="panel">
        <h2>Ngân hàng đề</h2>

        <div id="admin-problem-count">Đang tải...</div>

        <div class="toolbar">
            <button type="button" id="select-all" class="secondary">
                Chọn tất cả
            </button>

            <button type="button" id="deselect-all" class="secondary">
                Bỏ chọn
            </button>

            <button type="button" id="delete-selected" class="danger" disabled>
                Xóa bài đã chọn (0)
            </button>
        </div>

        <div id="problem-list">Đang tải danh sách bài...</div>
    </section>

    <!-- THÊM / SỬA BÀI TẬP -->
    <section class="panel">
        <h2 id="editor-title">Thêm bài tập</h2>

        <form id="problem-form">
            <label for="problem-json">
                Nội dung bài tập dạng JSON
            </label>

            <p class="muted">
                Dán toàn bộ JSON của một bài tập vào ô dưới đây.
            </p>

            <textarea
                id="problem-json"
                required
                placeholder='{"id":"BAI1","title":"Tên bài", ...}'
            ></textarea>

            <div id="problem-message" class="message"></div>

            <button type="submit" id="save-problem">
                Thêm bài tập
            </button>

            <button
                type="button"
                id="cancel-edit"
                class="secondary"
                hidden
            >
                Hủy sửa
            </button>
        </form>
    </section>

    <script>
        const list = document.getElementById('problem-list');
        const count = document.getElementById('admin-problem-count');
        const form = document.getElementById('problem-form');
        const editor = document.getElementById('problem-json');
        const message = document.getElementById('problem-message');
        const title = document.getElementById('editor-title');
        const saveButton = document.getElementById('save-problem');
        const cancelButton = document.getElementById('cancel-edit');

        const selectAllButton = document.getElementById('select-all');
        const deselectAllButton = document.getElementById('deselect-all');
        const deleteSelectedButton =
            document.getElementById('delete-selected');

        const usersList = document.getElementById('users-list');
        const userMessage = document.getElementById('user-message');
        const refreshUsersButton =
            document.getElementById('refresh-users');

        let editingId = null;
        const selectedIds = new Set();

        async function api(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    ...(options.body !== undefined
                        ? { 'Content-Type': 'application/json' }
                        : {}),
                    ...(options.headers || {})
                }
            });

            const text = await response.text();
            let data = {};

            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                data = { message: text };
            }

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    data.message ||
                    `Lỗi HTTP ${response.status}`
                );
            }

            return data;
        }

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = 'message ' +
                (isError ? 'error-message' : 'success-message');
        }

        function showUserMessage(text, isError = false) {
            userMessage.textContent = text;
            userMessage.className = 'message ' +
                (isError ? 'error-message' : 'success-message');
        }

        function resetEditor() {
            editingId = null;
            editor.value = '';
            title.textContent = 'Thêm bài tập';
            saveButton.textContent = 'Thêm bài tập';
            cancelButton.hidden = true;
            showMessage('');
        }

        function updateSelectedCount() {
            const n = selectedIds.size;
            deleteSelectedButton.textContent = `Xóa bài đã chọn (${n})`;
            deleteSelectedButton.disabled = n === 0;
        }

        function makeButton(text, className, onClick) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = text;
            button.className = className;
            button.addEventListener('click', onClick);
            return button;
        }

        // =========================
        // QUẢN LÝ TÀI KHOẢN
        // =========================

        async function loadUsers() {
            usersList.textContent = 'Đang tải tài khoản...';
            showUserMessage('');

            refreshUsersButton.disabled = true;

            try {
                const users = await api('/api/admin/users');

                usersList.replaceChildren();

                if (!Array.isArray(users) || users.length === 0) {
                    usersList.textContent =
                        'Chưa có tài khoản học sinh.';
                    return;
                }

                for (const user of users) {
                    const row = document.createElement('div');
                    row.className = 'section-heading';

                    const info = document.createElement('div');
                    info.className = 'problem-info';

                    const textInfo = document.createElement('div');

                    const heading = document.createElement('h3');
                    heading.textContent =
                        `${user.username} (#${user.id})`;

                    const status = document.createElement('span');
                    status.className = 'user-status' +
                        (user.approved ? ' approved' : '');

                    status.textContent = user.approved
                        ? 'Đã phê duyệt'
                        : 'Đang chờ phê duyệt';

                    textInfo.append(heading, status);

                    if (user.created_at) {
                        const created = document.createElement('p');
                        created.className = 'muted';
                        created.style.marginTop = '6px';
                        created.textContent =
                            `Ngày tạo: ${user.created_at}`;
                        textInfo.appendChild(created);
                    }

                    info.appendChild(textInfo);
                    row.appendChild(info);

                    if (!user.approved) {
                        const approveButton = makeButton(
                            'Phê duyệt',
                            'success',
                            async () => {
                                if (approveButton.disabled) {
                                    return;
                                }

                                approveButton.disabled = true;
                                approveButton.textContent = 'Đang duyệt...';

                                try {
                                    await api(
                                        `/api/admin/users/${user.id}/approve`,
                                        { method: 'POST' }
                                    );

                                    showUserMessage(
                                        `Đã phê duyệt tài khoản ${user.username}.`
                                    );

                                    await loadUsers();
                                } catch (error) {
                                    showUserMessage(error.message, true);
                                    approveButton.disabled = false;
                                    approveButton.textContent = 'Phê duyệt';
                                }
                            }
                        );

                        row.appendChild(approveButton);
                    }

                    usersList.appendChild(row);
                }
            } catch (error) {
                usersList.textContent =
                    'Không tải được danh sách tài khoản.';
                showUserMessage(error.message, true);
            } finally {
                refreshUsersButton.disabled = false;
            }
        }

        refreshUsersButton.addEventListener('click', loadUsers);

        // =========================
        // QUẢN LÝ BÀI TẬP
        // =========================

        async function loadProblems() {
            list.textContent = 'Đang tải danh sách bài...';

            try {
                const problems = await api('/api/admin/problems');

                const existingIds = new Set(
                    problems.map(problem => String(problem.id))
                );

                for (const id of selectedIds) {
                    if (!existingIds.has(String(id))) {
                        selectedIds.delete(id);
                    }
                }

                count.textContent = `Tổng số bài: ${problems.length}`;
                list.replaceChildren();

                if (problems.length === 0) {
                    list.textContent = 'Chưa có bài tập nào.';
                    updateSelectedCount();
                    return;
                }

                for (const problem of problems) {
                    const row = document.createElement('div');
                    row.className = 'section-heading';

                    const info = document.createElement('div');
                    info.className = 'problem-info';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked =
                        selectedIds.has(String(problem.id));

                    checkbox.setAttribute(
                        'aria-label',
                        `Chọn bài ${problem.title}`
                    );

                    checkbox.addEventListener('change', () => {
                        const id = String(problem.id);

                        if (checkbox.checked) {
                            selectedIds.add(id);
                        } else {
                            selectedIds.delete(id);
                        }

                        updateSelectedCount();
                    });

                    const textInfo = document.createElement('div');

                    const heading = document.createElement('h3');
                    heading.textContent =
                        `${problem.id} — ${problem.title}`;

                    const detail = document.createElement('p');
                    detail.className = 'muted';
                    detail.textContent =
                        `${problem.total_score} điểm · ` +
                        `${(problem.subtasks || []).length} subtasks`;

                    textInfo.append(heading, detail);
                    info.append(checkbox, textInfo);

                    const actions = document.createElement('div');

                    actions.append(
                        makeButton('Sửa', 'secondary', () => {
                            editingId = String(problem.id);
                            editor.value =
                                JSON.stringify(problem, null, 2);

                            title.textContent = `Sửa bài ${problem.id}`;
                            saveButton.textContent = 'Lưu thay đổi';
                            cancelButton.hidden = false;
                            showMessage('');

                            editor.focus();

                            window.scrollTo({
                                top: document.body.scrollHeight,
                                behavior: 'smooth'
                            });
                        }),

                        makeButton('Xóa', 'danger', async () => {
                            if (!confirm(
                                `Mày có chắc muốn xóa bài "${problem.title}"?`
                            )) {
                                return;
                            }

                            try {
                                await api(
                                    `/api/admin/problems/${encodeURIComponent(problem.id)}`,
                                    { method: 'DELETE' }
                                );

                                selectedIds.delete(String(problem.id));

                                if (editingId === String(problem.id)) {
                                    resetEditor();
                                }

                                await loadProblems();
                                showMessage('Đã xóa bài tập.');
                            } catch (error) {
                                alert(
                                    `Không xóa được bài: ${error.message}`
                                );
                            }
                        })
                    );

                    row.append(info, actions);
                    list.appendChild(row);
                }

                updateSelectedCount();
            } catch (error) {
                list.textContent = error.message;
                count.textContent = 'Không tải được ngân hàng đề.';
            }
        }

        selectAllButton.addEventListener('click', async () => {
            try {
                const problems = await api('/api/admin/problems');

                selectedIds.clear();

                for (const problem of problems) {
                    selectedIds.add(String(problem.id));
                }

                await loadProblems();
            } catch (error) {
                alert(`Không tải được danh sách: ${error.message}`);
            }
        });

        deselectAllButton.addEventListener('click', () => {
            selectedIds.clear();
            loadProblems();
        });

        deleteSelectedButton.addEventListener('click', async () => {
            const ids = [...selectedIds];

            if (ids.length === 0) {
                alert('Mày chưa chọn bài nào.');
                return;
            }

            const confirmed = confirm(
                `CẢNH BÁO: Mày sắp xóa ${ids.length} bài tập.\n\n` +
                'Thao tác này không thể hoàn tác. Mày có chắc không?'
            );

            if (!confirmed) {
                return;
            }

            deleteSelectedButton.disabled = true;
            selectAllButton.disabled = true;
            deselectAllButton.disabled = true;

            let deleted = 0;
            const errors = [];

            try {
                for (const id of ids) {
                    try {
                        await api(
                            `/api/admin/problems/${encodeURIComponent(id)}`,
                            { method: 'DELETE' }
                        );

                        selectedIds.delete(id);
                        deleted++;
                    } catch (error) {
                        errors.push(`${id}: ${error.message}`);
                    }
                }

                await loadProblems();

                if (errors.length === 0) {
                    alert(`Đã xóa thành công ${deleted} bài tập.`);
                } else {
                    alert(
                        `Đã xóa ${deleted}/${ids.length} bài.\n\n` +
                        'Các bài chưa xóa được:\n' + errors.join('\n')
                    );
                }
            } catch (error) {
                alert(
                    `Đã xóa ${deleted} bài trước khi xảy ra lỗi: ` +
                    error.message
                );

                await loadProblems();
            } finally {
                selectAllButton.disabled = false;
                deselectAllButton.disabled = false;
                updateSelectedCount();
            }
        });

        form.addEventListener('submit', async event => {
            event.preventDefault();

            let problem;

            try {
                problem = JSON.parse(editor.value);
            } catch (error) {
                showMessage(
                    `JSON không hợp lệ: ${error.message}`,
                    true
                );
                return;
            }

            if (
                !problem ||
                typeof problem !== 'object' ||
                Array.isArray(problem)
            ) {
                showMessage(
                    'Dữ liệu phải là một đối tượng JSON.',
                    true
                );
                return;
            }

            saveButton.disabled = true;

            try {
                if (editingId !== null) {
                    problem.id = editingId;

                    await api(
                        `/api/admin/problems/${encodeURIComponent(editingId)}`,
                        {
                            method: 'PUT',
                            body: JSON.stringify(problem)
                        }
                    );

                    resetEditor();
                    await loadProblems();
                    showMessage('Đã cập nhật bài tập.');
                } else {
                    await api('/api/admin/problems', {
                        method: 'POST',
                        body: JSON.stringify(problem)
                    });

                    resetEditor();
                    await loadProblems();
                    showMessage('Đã thêm bài tập.');
                }
            } catch (error) {
                showMessage(
                    `Không lưu được: ${error.message}`,
                    true
                );
            } finally {
                saveButton.disabled = false;
            }
        });

        cancelButton.addEventListener('click', resetEditor);

        // Tải cả tài khoản và ngân hàng đề khi mở trang.
        loadUsers();
        loadProblems();
    </script>

</body>
</html>
