<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài nộp của tôi</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0b1020;
      color: #edf2ff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 1150px;
      margin: auto;
      background: #131c30;
      border: 1px solid #27344d;
      border-radius: 16px;
      padding: 24px;
    }
    h1 { margin-top: 0; }
    .muted { color: #9eacc5; }
    button, select, input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #27344d;
      margin: 5px 0;
    }
    button {
      background: #8b7cff;
      color: white;
      cursor: pointer;
    }
    input, select {
      background: #0b1222;
      color: white;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #27344d;
    }
    th { color: #9eacc5; }
    .AC { color: #34d399; }
    .WA { color: #fca5a5; }
    .other { color: #fcd34d; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Bài nộp của tôi</h1>
    <p class="muted">Lịch sử các bài lập trình đã nộp.</p>

    <input id="search" placeholder="Tìm theo ID hoặc mã bài...">
    <select id="filter">
      <option value="">Tất cả kết quả</option>
      <option value="Accepted">Accepted</option>
      <option value="Wrong Answer">Wrong Answer</option>
      <option value="Processing">Processing</option>
      <option value="Queued">Queued</option>
    </select>
    <button onclick="loadSubmissions()">Làm mới</button>
    <p id="message" class="muted">Đang tải...</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Bài tập</th>
            <th>Ngôn ngữ</th>
            <th>Kết quả</th>
            <th>Điểm</th>
            <th>Thời gian</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    let submissions = [];

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function verdictClass(verdict) {
      if (verdict === 'Accepted') return 'AC';
      if (verdict === 'Wrong Answer') return 'WA';
      return 'other';
    }

    function renderSubmissions() {
      const search = document.getElementById('search').value.toLowerCase();
      const filter = document.getElementById('filter').value;

      const filtered = submissions.filter(s =>
        (String(s.id).includes(search) ||
         String(s.problem_id).toLowerCase().includes(search)) &&
        (!filter || s.verdict === filter)
      );

      document.getElementById('rows').innerHTML = filtered.map(s => `
        <tr>
          <td>${escapeHTML(s.id)}</td>
          <td>${escapeHTML(s.problem_id)}</td>
          <td>${escapeHTML(s.language_id)}</td>
          <td class="${verdictClass(s.verdict)}">${escapeHTML(s.verdict)}</td>
          <td>${escapeHTML(s.score ?? 0)} / ${escapeHTML(s.max_score ?? 0)}</td>
          <td>${escapeHTML(s.created_at)}</td>
        </tr>
      `).join('');

      document.getElementById('message').textContent =
        filtered.length ? `Hiển thị ${filtered.length} bài nộp.` :
        'Không có bài nộp phù hợp.';
    }

    async function loadSubmissions() {
      const message = document.getElementById('message');
      message.textContent = 'Đang tải...';

      try {
        const response = await fetch('/api/submissions');
        const data = await response.json();

        if (!response.ok) {
          message.textContent = data.error || 'Không thể tải bài nộp.';
          return;
        }

        submissions = data;
        renderSubmissions();
      } catch (error) {
        message.textContent = 'Lỗi kết nối máy chủ.';
      }
    }

    document.getElementById('search').addEventListener('input', renderSubmissions);
    document.getElementById('filter').addEventListener('change', renderSubmissions);

    loadSubmissions();
  </script>
</body>
</html>
